name: Diagnóstico de secretos FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnostico-secretos.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generar reporte
        env:
          FTPU: ${{ secrets.FTP_USERNAME }}
          FTPP: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set +e
          {
            echo "## Diagnóstico deploy $(date -u +%FT%TZ)"
            echo ""
            echo "- **FTP_USERNAME definido:** $([ -n "$FTPU" ] && echo SI || echo NO)"
            echo "- **FTP_PASSWORD definido:** $([ -n "$FTPP" ] && echo SI || echo NO)"
            echo "- sha256(user) 12: \`$(printf '%s' "$FTPU" | sha256sum | cut -c1-12)\`"
            echo "- sha256(pass) 12: \`$(printf '%s' "$FTPP" | sha256sum | cut -c1-12)\`"
            echo ""
            echo "### DNS ftpupload.net"
            echo '```'
            getent hosts ftpupload.net
            echo "exit: $?"
            echo '```'
            echo "### Puerto 21"
            echo '```'
            timeout 15 bash -c 'cat < /dev/null > /dev/tcp/ftpupload.net/21' && echo "puerto 21 ACEPTA" || echo "puerto 21 RECHAZADO"
            echo '```'
            echo "### curl FTP (listado de htdocs)"
            echo '```'
            OUT=$(curl -sS --max-time 60 --user "$FTPU:$FTPP" --list-only "ftp://ftpupload.net/floreriatulisol.gamer.free/htdocs/" 2>&1)
            RC=$?
            echo "$OUT" | head -n 15
            echo "curl exit: $RC"
            echo '```'
          } > /tmp/diag.md

      - name: Publicar reporte en el repo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          cd /tmp
          git init outdiag >/dev/null 2>&1
          cd outdiag
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin main >/dev/null 2>&1
          git checkout -B main FETCH_HEAD >/dev/null 2>&1
          cp /tmp/diag.md diagnostico_resultado.md
          git add diagnostico_resultado.md
          git -c user.email="diag@actions" -c user.name="diagnostico" commit -m "diag: resultado del diagnostico FTP" >/dev/null
          git push origin main
# re-ejecucion tras configurar secretos
