name: Diagnóstico de secretos FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnostico-secretos.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comprobar secretos y conexión FTP
        env:
          FTPU: ${{ secrets.FTP_USERNAME }}
          FTPP: ${{ secrets.FTP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Diagnóstico deploy $(date -u +%FT%TZ)"
            echo ""
            echo "- **FTP_USERNAME definido:** $([ -n "$FTPU" ] && echo SI || echo NO)"
            echo "- **FTP_PASSWORD definido:** $([ -n "$FTPP" ] && echo SI || echo NO)"
            echo "- sha256(user) 12 primeros: \`$(printf '%s' "$FTPU" | sha256sum | cut -c1-12)\`"
            echo "- sha256(pass) 12 primeros: \`$(printf '%s' "$FTPP" | sha256sum | cut -c1-12)\`"
            echo ""
            if [ -n "$FTPU" ] && [ -n "$FTPP" ]; then
              echo "### Prueba FTP desde el runner"
              echo '```'
              OUT=$(curl -sS --max-time 60 --user "$FTPU:$FTPP" --list-only "ftp://ftpupload.net/floreriatulisol.gamer.free/htdocs/" 2>&1)
              RC=$?
              echo "$OUT" | head -n 20
              echo "curl exit: $RC"
              echo '```'
            else
              echo "### No hay secretos: no se puede probar FTP"
            fi
          > "$GITHUB_STEP_SUMMARY"
          REPORT=$(cat "$GITHUB_STEP_SUMMARY")
          gh issue create --title "Diagnóstico deploy FTP" --body "$REPORT" || true
