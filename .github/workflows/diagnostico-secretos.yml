name: Diagnóstico de secretos FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnostico-secretos.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comprobar secretos y conexión FTP
        env:
          FTPU: ${{ secrets.FTP_USERNAME }}
          FTPP: ${{ secrets.FTP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          REPORT="/tmp/diag.md"
          {
            echo "## Diagnóstico deploy $(date -u +%FT%TZ)"
            echo ""
            echo "- **FTP_USERNAME definido:** $([ -n "$FTPU" ] && echo SI || echo NO)"
            echo "- **FTP_PASSWORD definido:** $([ -n "$FTPP" ] && echo SI || echo NO)"
            echo "- sha256(user) 12: \`$(printf '%s' "$FTPU" | sha256sum | cut -c1-12)\`"
            echo "- sha256(pass) 12: \`$(printf '%s' "$FTPP" | sha256sum | cut -c1-12)\`"
            echo ""
            echo "### DNS ftpupload.net"
            echo '```'
            getent hosts ftpupload.net
            echo "getent exit: $?"
            echo '```'
            echo "### Puerto 21"
            echo '```'
            timeout 15 bash -c 'cat < /dev/null > /dev/tcp/ftpupload.net/21' && echo "puerto 21 ACEPTA conexiones" || echo "puerto 21 RECHAZADO/BLOQUEADO"
            echo '```'
            echo "### curl FTP"
            echo '```'
            OUT=$(curl -sS --max-time 60 --user "$FTPU:$FTPP" --list-only "ftp://ftpupload.net/floreriatulisol.gamer.free/htdocs/" 2>&1)
            RC=$?
            echo "$OUT" | head -n 15
            echo "curl exit: $RC"
            echo '```'
          } > "$REPORT"
          cat "$REPORT"
          gh issue create --title "Diagnóstico deploy FTP" --body "$(cat "$REPORT")" 2>&1 | tail -n 3
          echo "fin diagnostico"
