name: Despliegue Automático a InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sincronizar con Hosting
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Subir cambios por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftpupload.net' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: htdocs/
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scratch/**
            .opencode/**
            diagnostico.php
            README.md
