name: Despliegue Automático a InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sincronizar con Hosting
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Subir cambios por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER || 'ftpupload.net' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: floreriatulisol.gamer.free/htdocs/
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scratch/**
            .opencode/**
            diagnostico.php
            .user.ini
            .htaccess.simple
            database/**
            desplegar.bat
            deploy.local.php
            *.md
            *.log
            Thumbs.db
